    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/brand/niji-dark.png" type="image/png" />
    <link rel="alternate icon" href="./assets/icons/favicon-32.png" sizes="32x32" />

    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <title>nijip2p: escrowed P2P trading - Remote &amp; In-Person</title>
    <meta name="description" content="nijip2p is a peer-to-peer trading app for USDC and USDT. The contract holds the seller's stablecoins in escrow - remote payments and in-person cash - and disputes get one binary ruling from an on-chain court. Non-custodial, no account, no wallet connection." />
    <script>
      // Theme bootstrap before first paint — no flash of the wrong theme.
      try {
        var t = localStorage.getItem("nijip2p-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script src="./heal.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
